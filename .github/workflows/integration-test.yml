name: Video compressor integration test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js

      - name: Generate a short test video
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x240:rate=24 \
            -f lavfi -i sine=frequency=1000:sample_rate=44100 \
            -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac test-input.mp4
          test -s test-input.mp4

      - name: Start application
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > health.json; then
              break
            fi
            sleep 1
          done
          cat health.json
          node -e "const h=require('./health.json'); if(!h.ok) process.exit(1)"

      - name: Upload and compress test video
        run: |
          curl --fail --show-error --silent \
            -D response-headers.txt \
            -o test-output.mp4 \
            -H 'Content-Type: application/octet-stream' \
            -H 'X-File-Name: test-input.mp4' \
            -H 'X-Compression-Mode: extreme' \
            --data-binary @test-input.mp4 \
            http://127.0.0.1:3000/api/compress
          test -s test-output.mp4
          grep -qi '^content-type: video/mp4' response-headers.txt
          grep -qi '^x-compressed-bytes:' response-headers.txt
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height -of json test-output.mp4 > output-info.json
          cat output-info.json
          node -e "const x=require('./output-info.json'); const v=x.streams.find(s=>s.codec_type==='video'||s.width); if(!v||v.width!==320||v.height!==240||!['hevc','h265'].includes(v.codec_name)) { console.error('Unexpected video stream',v); process.exit(1); } const d=Number(x.format.duration); if(!Number.isFinite(d)||d<2.8||d>3.2){console.error('Unexpected duration',d);process.exit(1)}"
